  - url: "https://github.com/spinframework/containerd-shim-spin"
  - url: "https://github.com/spinframework/runtime-class-manager"
  - url: "https://github.com/spinframework/spin-plugin-kube"
  - url: "https://github.com/spinframework/spinkube-docs"
  - url: "https://github.com/spinframework/spinkube-governance"

website: "https://www.spinkube.dev/"

